[workspace]
name = "frozen-bath-defect"
channels = ["conda-forge"]
platforms = [{ platform = "linux-64", archspec = "zen5" }]

[dependencies]
python = { version = "==3.12.13", build = "hd63d673_0_cpython" }
pyscf = { version = "==2.13.1", build = "py310h50f34b9_1400" }
numpy = { version = "==2.4.6", build = "py312h33ff503_0" }
scipy = { version = "==1.18.0", build = "py312h54fa4ab_0" }
h5py = { version = "==3.16.0", build = "nompi_py312ha829cd9_102" }
geometric = { version = "==1.1.1", build = "pyhd8ed1ab_0" }
libblas = { version = "==3.11.0", build = "5_h4a7cf45_openblas" }
libopenblas = { version = "==0.3.30", build = "openmp_hd680484_4" }
llvm-openmp = { version = "==22.1.8", build = "h4922eb0_0" }

[tasks]
relax = "python hact_relax/relax_defect.py"

[feature.dev.pypi-dependencies]
ipykernel = "*"
ipython = "*"
monkeytype = "*"
mypy = "*"
pytest = "*"

[environments]
dev = ["dev"]
